<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-0HjDX1kqq8CLg9BflK2IPxwjNKAsa7V7vXWmgF9xSow='; style-src 'sha256-Iz6IfgAZ1Dkb+qZ1FJC/YLbpdulkrKU1OQ7wZea7GEU='; connect-src 'none'; base-uri 'none'; form-action 'none'; img-src data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladybug demo</title>
<!--
DECISION: chosen  -> hand-written WebGL2 (~250 lines), zero external scripts.
          rejected -> three.js from a CDN.
          why      -> the end goal is fully local; the page must work offline, and CSP can
                      then forbid every external origin.
-->
<style>
  :root {
    --bg-1: #0d1220; --bg-2: #18213a; --panel: #111827cc; --line: #ffffff1a;
    --text: #e5e7eb; --muted: #9ca3af; --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(42% 48% at 32% 52%, #2a3a63 0%, #2a3a6300 100%),
                radial-gradient(120% 90% at 30% 20%, var(--bg-2), var(--bg-1));
    color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 1fr; overflow: hidden;
  }
  /* left: the scene on top, the Matrix panel under it. Right (app only): the chat, all the way down */
  #left { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #left #stage { flex: 1 1 auto; }
  #stage { position: relative; min-height: 0; --chill: 0; }
  #stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--chill);
    background: radial-gradient(30% 30% at 22% 18%, #fff4c2cc, #fff4c200 70%),
                linear-gradient(#5fb8f5 0%, #9fd8fb 45%, #ffe1b0 72%, #f8c68c 100%);
  }
  canvas { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
  #bubble {
    position: absolute; z-index: 2; left: 50%; top: 14px; transform: translateX(-50%);
    max-width: min(560px, 86%); padding: 12px 16px; border-radius: 14px;
    background: #ffffffee; color: #111827; font-weight: 500; box-shadow: 0 8px 30px #0006;
    transition: opacity .25s, background-color .25s; overflow-wrap: anywhere;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
    border: 9px solid transparent; border-bottom: 0; border-top-color: inherit;
  }
  #bubble.warn { background: #fef3c7; } #bubble.bad { background: #fee2e2; } #bubble.good { background: #d1fae5; }
  #bubble:empty { opacity: 0; }
  #nogl { position: absolute; inset: auto 0 12% 0; text-align: center; color: var(--muted); display: none; }
  aside {
    background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
    min-height: 0; backdrop-filter: blur(6px);
  }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header .title { font-weight: 650; font-size: 15px; letter-spacing: .2px; }
  .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  #conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #conn i { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; display: inline-block; }
  #conn.on i { background: #34d399; } #conn.err i { background: #f87171; }

  /* ---- the Matrix panel: what the assistant calls, live. Green on black, faint code rain behind the lines ---- */
  #matrix { --mx: #39ff6a; --mx-dim: #1f9d45; --mx-hi: #c8ffd6;
            position: relative; flex: 0 0 34vh; min-height: 150px; display: flex; flex-direction: column; overflow: hidden;
            background: #010803; border-top: 1px solid #00ff4140; color: var(--mx);
            font: 12.5px/1.5 "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace; }
  #rain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .32; pointer-events: none; }
  #matrix > :not(#rain) { position: relative; z-index: 1; }
  .mx-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 12px;
             background: #010803d9; border-bottom: 1px solid #00ff4126; text-shadow: 0 0 6px #00ff4180; }
  #state { text-transform: uppercase; letter-spacing: 2px; font-weight: 700; color: var(--mx-hi); }
  .mx-stats { color: var(--mx-dim); white-space: nowrap; } .mx-stats b { color: var(--mx); font-weight: 700; }
  #log { list-style: none; margin: 0; padding: 6px 0; overflow: auto; flex: 1; min-height: 0;
         scrollbar-width: thin; scrollbar-color: #1f9d45 transparent; }
  #log li { padding: 1px 12px; display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; }
  #log time { color: var(--mx-dim); font-variant-numeric: tabular-nums; }
  #log .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               animation: mxtype .45s steps(28, end) both; text-shadow: 0 0 5px #00ff4166; }
  @keyframes mxtype { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  #log .t { color: var(--mx-hi); font-weight: 700; } #log .d { color: var(--mx); opacity: .8; margin-left: 8px; }
  #log .st { color: var(--mx-dim); } #log .st.ok { color: var(--mx); } #log .st.bad { color: #ff5f5f; }
  #log .st.wait::after { content: "▌"; animation: mxblink 1s steps(1) infinite; }
  @keyframes mxblink { 50% { opacity: 0; } }
  #log .bad .t { color: #ff5f5f; } #log .good .t { color: var(--mx); } #log .warn .t { color: #f5d75f; }
  #log .reply { cursor: pointer; } #log .reply .line { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; } #log .reply.open .line { display: block; }
  #log .sep .line { color: var(--mx-dim); }
  .mx-foot { display: flex; gap: 10px; align-items: center; padding: 6px 12px 8px; background: #010803d9;
             border-top: 1px solid #00ff4126; white-space: nowrap; overflow: hidden; }
  #mxBar { color: var(--mx); text-shadow: 0 0 6px #00ff4199; letter-spacing: -.5px; }
  #mxInfo { color: var(--mx-dim); overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) { #log .line { animation: none; } #rain { display: none; } }
  footer { padding: 10px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

  /* ---- the prompt box (only when served by the app: python -m agent.app) ---- */
  /* the avatar viewer alone (python -m agent.avatar): the scene and the Matrix panel take the whole window */
  body:not(.app) aside { display: none; }
  /* DECISION: the scene keeps 7:5 in a column of its own on the left, the chat gets the rest of the width.
     why -> the user asked for the chat to be easy to read (2026-11-02): it had a third of the width */
  body.app { grid-template-columns: clamp(320px, 30vw, 560px) minmax(0, 1fr); }
  body.app #left #stage { flex: 0 0 auto; aspect-ratio: 7 / 5; max-height: 52vh; }
  body.app #matrix { flex: 1 1 auto; }
  #chat, #composer { display: none; }
  /* the chat reads in one centred column (long lines are hard to read); the padding centres it, tables may use it all */
  body.app aside { --gutter: max(20px, calc((100% - 940px) / 2)); }
  body.app #chat { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; overflow: auto;
                   padding: 18px var(--gutter) 24px; }
  body.app #foot { display: none; }
  body.app #composer { display: block; padding: 12px var(--gutter) 14px; border-top: 1px solid var(--line); }
  .msg { border-radius: 12px; padding: 12px 16px; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; max-width: 88%; background: #6ea8fe26; border: 1px solid #6ea8fe40; white-space: pre-wrap; }
  .msg.assistant { background: #ffffff0b; border: 1px solid var(--line); }
  .msg.system { color: var(--muted); background: transparent; border: 1px dashed var(--line); white-space: pre-wrap; font-size: 13px; }
  .msg.error { background: #f871711a; border: 1px solid #f8717155; }
  .msg .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .msg table { border-collapse: collapse; margin: 8px 0; font-size: 14px; display: block; overflow-x: auto; max-width: 100%; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; min-width: 60px; }
  .msg th { background: #ffffff0d; }
  .msg h3, .msg h4 { margin: 12px 0 6px; font-size: 16px; } .msg p { margin: 6px 0; }
  .msg ul, .msg ol { margin: 6px 0; padding-left: 22px; } .msg li { margin: 3px 0; }
  .msg code { background: #ffffff14; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg pre { background: #0b1020; padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .msg a, #composer a, .hint a { color: var(--accent); }
  .approve { border: 1px solid #fbbf2488; background: #fbbf2414; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .approve dl { margin: 6px 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .approve dt { color: var(--muted); } .approve dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  .approve .btns { display: flex; gap: 8px; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .perm { margin-top: 8px; border: 1px solid #6ea8fe66; background: #6ea8fe14; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
  .perm b { display: block; margin-bottom: 2px; }
  .perm .btns, .webwarn .btns { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .webwarn { margin-top: 8px; border: 1px solid #fbbf2488; background: #fbbf2414; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
  .webwarn q { color: var(--muted); }
  .approve .why { margin-top: 4px; color: #fcd34d; font-size: 12px; }
  .hint button { margin: 4px 4px 0 0; }
  #composer textarea { width: 100%; min-height: 60px; max-height: 30vh; resize: vertical; padding: 10px 12px; border-radius: 10px;
                       font-size: 15px !important; line-height: 1.5;
                       border: 1px solid var(--line); background: #0b1020; color: var(--text); font: inherit; }
  #composer textarea:focus { outline: 2px solid #6ea8fe88; border-color: transparent; }
  #composer .bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #attached { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px 3px 6px; border-radius: 8px;
          border: 1px solid var(--line); background: #ffffff0c; font-size: 12px; }
  .chip img { width: 40px; height: 28px; object-fit: cover; border-radius: 4px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0 4px; }
  .msg .redo { margin-top: 8px; padding: 3px 10px; font-size: 12px; }
  .msg .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #composer.drop { outline: 2px dashed #6ea8fe; outline-offset: 4px; border-radius: 8px; }
  #composer .bar .sp { flex: 1; }
  .cbtn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #ffffff10; color: var(--text);
          font: inherit; font-size: 13px; cursor: pointer; }
  .cbtn.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
  .cbtn.danger { border-color: #f8717188; color: #fca5a5; }
  .cbtn:disabled { opacity: .45; cursor: default; }
  .prog { border: 1px solid #6ea8fe66; background: #6ea8fe10; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .prog .bar { position: relative; height: 6px; border-radius: 3px; background: #ffffff14; margin: 6px 0; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  /* something is running: a light sweeps along the bar, so one long step (a single driver, a scan) never looks stuck */
  .prog .bar s { display: none; position: absolute; top: 0; bottom: 0; left: 0; width: 30%;
                 background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .75;
                 animation: progspin 1.6s ease-in-out infinite; }
  .prog .bar.active s { display: block; }
  @keyframes progspin { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .prog .now { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .prog .uac { margin-top: 6px; border: 1px solid #fbbf2488; background: #fbbf2418; border-radius: 8px; padding: 6px 8px;
               color: #fcd34d; font-size: 12.5px; }
  .prog ul { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; }
  .prog li { padding: 1px 0; overflow-wrap: anywhere; } .prog li.ok::before { content: "✓ "; color: #34d399; }
  .prog li.bad::before { content: "✗ "; color: #f87171; } .prog li small { color: var(--muted); }
  #meter { font-size: 11.5px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  /* narrow windows: everything in one column, the chat below */
  @media (max-width: 820px) { body, body.app { grid-template-columns: 1fr; overflow: auto; }
    #left #stage { height: 42vh; flex: none; aspect-ratio: auto; } #matrix, body.app #matrix { flex: 0 0 26vh; }
    body.app aside { min-height: 85vh; } }
  #micBtn.on { background: #e5484d; color: #fff; border-color: #e5484d; }
  /* the status line keeps its two lines of space while voice commands are on: if it grew when a hold started, the
     button row moved up from under the pointer and the hold ended at once */
  #heard { font-size: 12px; color: var(--muted, #8a93a6); margin: 4px 2px 0; line-height: 1.35; height: 2.7em;
           overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #heard[hidden] { display: none; }
  #heard b { color: inherit; }

  /* ---- the chat in the Matrix panel's style: the same green on black, set apart by a lighter panel and a glowing
     edge. Answers keep a plain font (long text reads better); headings, labels and the box are terminal type ---- */
  body.app aside {
    --mx: #39ff6a; --mx-dim: #1f9d45; --mx-hi: #c8ffd6; --mono: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    --line: #00ff4126; --muted: #74c48c; --accent: #5cff85; --text: #dcffe6;
    background: linear-gradient(180deg, #04170b 0%, #020e06 100%); color: var(--text);
    border-left: 2px solid #00ff4199; box-shadow: -8px 0 28px #00ff4126, inset 10px 0 24px #00ff4110; backdrop-filter: none;
  }
  body.app aside header { background: #010803; border-bottom: 1px solid #00ff4140; }
  body.app aside header .title { font-family: var(--mono); text-transform: uppercase; letter-spacing: 2.5px; color: var(--mx-hi);
                                 text-shadow: 0 0 8px #00ff4199; }
  body.app aside header .title::before { content: "> "; color: var(--mx); }
  body.app aside #conn { font-family: var(--mono); }
  body.app #chat { scrollbar-width: thin; scrollbar-color: #1f9d45 transparent; }
  .msg.assistant { background: #00ff410a; border: 1px solid #00ff4138; box-shadow: 0 0 14px #00ff410f; }
  .msg.user { background: #00ff411c; border: 1px solid #00ff4170; color: var(--mx-hi); font-family: var(--mono); font-size: 14px; }
  .msg.system { border-color: #00ff4138; font-family: var(--mono); }
  .msg.error { background: #ff5f5f14; border-color: #ff5f5f66; }
  .msg b, .msg strong { color: #b4ffc6; }
  .msg h3, .msg h4 { font-family: var(--mono); color: var(--mx); letter-spacing: .3px; }
  .msg a, #composer a, .hint a { color: #7dffa0; }
  .msg code { background: #00ff4114; color: #a6ffbf; font-family: var(--mono); }
  .msg pre { background: #010803; border: 1px solid #00ff4126; color: #a6ffbf; font-family: var(--mono); }
  .msg th { background: #00ff4112; color: var(--mx-hi); }
  .msg .meta, #meter, #heard { font-family: var(--mono); color: var(--mx-dim); }
  body.app #composer { background: #010803e6; border-top: 1px solid #00ff4140; }
  #composer textarea { background: #010803; border-color: #00ff4140; color: var(--mx-hi); font-family: var(--mono);
                       caret-color: var(--mx); }
  #composer textarea::placeholder { color: #2f8a4b; }
  #composer textarea:focus { outline: 2px solid #39ff6a80; box-shadow: 0 0 12px #00ff4133; }
  .cbtn { background: #00ff410d; border-color: #00ff4140; color: var(--mx-hi); font-family: var(--mono); }
  .cbtn:hover:not(:disabled) { border-color: #39ff6aaa; box-shadow: 0 0 8px #00ff4140; }
  .cbtn.primary { background: var(--mx); border-color: var(--mx); color: #010803; }
  .cbtn.danger { border-color: #ff5f5f88; color: #ffb4b4; background: transparent; }
  .chip { border-color: #00ff4140; background: #00ff410d; font-family: var(--mono); }
  .prog { border-color: #00ff4166; background: #00ff410d; }
  .prog .bar i, .prog .bar s { background: var(--mx); }
  .perm { border-color: #00ff4166; background: #00ff410d; }

  /* portfolio embed: the scene only */
  html body { display: block; overflow: hidden !important; }
  html body #left { height: 100%; }
  html body #left #stage { height: 100% !important; flex: 1 1 auto !important; aspect-ratio: auto !important; max-height: none !important; }
  #matrix, #foot, aside, #nogl { display: none !important; }
  #bubble { font-size: 13px; padding: 8px 12px; max-width: 88%; }
</style>
</head>
<body>
<div id="left">
<div id="stage">
  <canvas id="c" aria-label="Animated ladybug mascot acting out a QA run"></canvas>
  <div id="bubble" role="status" aria-live="off"></div>
  <div id="nogl"></div>
</div>
<section id="matrix" aria-hidden="true"><canvas id="rain"></canvas><span id="state"></span><b id="s-step"></b><b id="s-calls"></b><b id="s-bad"></b><ul id="log"></ul><span id="mxBar"></span><span id="mxInfo"></span></section>
<footer id="foot"></footer>
</div>
<aside aria-hidden="true"><div id="conn"><i></i><span></span></div></aside>
<script>
"use strict";
// Portfolio embed: the parent page pauses the scene when it is off screen (postMessage {ladybug: "pause" | "play"}).
(() => {
  let paused = false;
  const raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = (cb) => raf(function wait(t) { if (paused) raf(wait); else cb(t); });
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent || e.origin !== location.origin || !e.data || typeof e.data.ladybug !== "string") return;
    paused = e.data.ladybug === "pause";
  });
})();
// ============================================================ state machine (no DOM, no GL)
const STATES = {
  idle:     { label: "Idle",               color: [0.43, 0.66, 1.00] },
  thinking: { label: "Thinking",           color: [0.65, 0.55, 0.98] },
  reading:  { label: "Reading",            color: [0.13, 0.83, 0.93] },
  moving:   { label: "Moving files",       color: [0.20, 0.83, 0.60] },
  waiting:  { label: "Needs approval",     color: [0.98, 0.75, 0.14] },
  denied:   { label: "Blocked",            color: [0.97, 0.44, 0.44] },
  done:     { label: "Done",               color: [0.20, 0.83, 0.60] },
  stuck:    { label: "Stopped",            color: [0.98, 0.57, 0.24] },
};
const BAD_PHASES = new Set(["denied", "rejected", "invalid", "conflict", "failed"]);
// served by the app (python -m agent.app) the page gets this run's key and shows the prompt box; the plain
// avatar viewer (python -m agent.avatar) leaves the placeholder and stays read-only
const APP_TOKEN = "__APP_TOKEN__";
const APP = !APP_TOKEN.startsWith("__");

// the clock: real time, or (in ?debug=1 manual mode) a simulated one the checks advance frame by frame
let simNow = null;
const nowMs = () => simNow ?? performance.now();
const ui = {
  state: "idle", since: performance.now(), bubble: "", tone: "",
  step: 0, calls: 0, bad: 0, point: false,   // point: an approval waits in the chat panel
};

// model text may carry markdown; the bubble and log show plain text
const plain = (s) => s.replace(/\*\*|__|`/g, "");
const DONE_LINES = ["Done. No biggie 😎", "All sorted. Easy 🍹", "Done ✓ Back to the beach"];
// 'claude-code:claude-sonnet-5-5' -> 'sonnet 5.5' (the same as agent.modelpick.short_name)
const modelName = (spec) => { const n = String(spec || "").split(":").slice(1).join(":") || String(spec || "");
                              const m = /^claude-([a-z]+)-(\d+)-(\d+)/.exec(n); return m ? `${m[1]} ${m[2]}.${m[3]}` : n.slice(0, 40); };
const str = (v, n = 120) => (typeof v === "string" ? (v.length > n ? v.slice(0, n - 1) + "…" : v) : "");

// Pure: event -> {state, bubble, tone, log:{t,d,cls}} ; untrusted strings are only ever used as text
function interpret(ev) {
  const a = (ev && typeof ev.args === "object" && ev.args) || {};
  switch (ev.type) {
    case "run_start":   return { state: "idle", bubble: "New task: " + str(ev.task, 160), log: ["run start", str(ev.task, 80)] };
    case "model_pick":  return { log: ["model", `${modelName(ev.model)} · ${str(ev.level, 12)} · ${str(ev.why, 60)}`] };
    case "model_switch": return { bubble: "This needs more thought: moving up a model…",
                                  log: ["model ↑", `${modelName(ev.model)} · ${str(ev.why, 70)}`, "warn"] };
    case "model_call":  return { state: "thinking", bubble: "Thinking…", step: ev.step, log: ["thinking", "step " + ev.step] };
    case "model_reply":
      return ev.tool_calls ? { log: ["plan", ev.tool_calls + " tool call(s)"] }
                           : { bubble: "Wrapping up…", log: ["reply", plain(str(ev.text, 600)), "reply"] };
    case "tool_start": {
      const tier = ev.tier;
      if (ev.tool === "move_file") {
        return { state: "moving", calls: 1, bubble: `Moving ${str(a.src, 60)} → ${str(a.dst, 60)}`,

           { spots: { dirs: SPOTS_BY_SIDE[sx], mirror: 1 } });
      if (o.open > 0.05) {
        const flap = Math.sin(t * 28) * 0.35 * reduce;
        draw(MESH.sphere, chain(B, T(sx * 0.16, 0.75, -0.5), RZ(-sx * (0.9 + flap) * o.open), RX(0.5), T(0, 0.6, 0), S(0.28, 0.66, 0.025)),
             WING, scaleV(col, 0.15), 1.0, { alpha: 0.42 * Math.min(1, o.open * 2) });
      }
    }

    // head: big and round, shiny eyes with two highlights, blush, smile (or frown)
    const nk = o.neck || 0;  // lifts the head clear of the shell top when lying back
    const H = chain(B, T(0, 1.22 + nk, 0.08 + nk * 0.6), RY(o.headYaw), RZ(o.headTilt), RX(o.headPitch));
    out.mouth = xf(H, MOUTH);
    draw(MESH.sphere, chain(H, S(0.62, 0.56, 0.56)), HEAD, BLACK, 0.75);
    const blink = st === "done" ? 0.2 : (o.blink ?? 1);
    const [gx, gy] = o.gaze || [0, 0];
    const eyeY = st === "done" ? 0.11 : st === "stuck" ? 0.02 : 0.07;
    if (suit) {   // the mask (shaped, with eye holes), knotted at the back with two tails
      const M = chain(H, T(0, eyeY - 0.07, 0));
      draw(MASK_MESH, M, MASK_C, BLACK, 0.15, { rim: [0.12, 0.12, 0.15] });
      const knot = [0, 0.09, -0.6];
      draw(MESH.sphere, chain(M, T(...knot), S(0.09, 0.075, 0.06)), MASK_C, BLACK, 0.15, { rim: [0.12, 0.12, 0.15] });
      for (const k of [-1, 1]) {   // the tails flutter, harder when it flies
        let prev = xf(M, knot);
        for (let j = 1; j <= 4; j++) {
          const wave = Math.sin(t * (6 + 5 * (o.spd || 0)) - j * 1.2 + k) * 0.03 * j * (0.4 + Math.min(1.5, o.spd || 0)) * reduce;
          const q = xf(M, [k * (0.04 + 0.05 * j) + wave * 0.5, 0.09 - 0.05 * j, -0.6 - 0.08 * j + wave]);
          draw(MESH.cyl, segM(prev, q, 0.026 * ks), MASK_C, BLACK, 0.15, { rim: [0.12, 0.12, 0.15] }); prev = q;
        }
      }
    }
    // eyes: through the mask they are narrower and slanted (inner corners down): watchful, a little mysterious
    const ez = suit ? 0.04 : 0, eh = suit ? 0.55 : 1;
    for (const sx of [-1, 1]) {
      // pupils follow the gaze; the highlights mostly stay put (they reflect the light, not the look)
      const px = sx * 0.22 + gx * 0.045, py = eyeY + gy * 0.035 * blink * eh, hx = sx * 0.22 + gx * 0.012;
      const E = chain(H, T(0, 0, ez), T(sx * 0.22, eyeY, 0), RZ(suit ? sx * 0.22 : 0), T(-sx * 0.22, -eyeY, 0));
      draw(MESH.sphere, chain(E, T(sx * 0.22, eyeY, 0.42), S(suit ? 0.16 : 0.17, 0.21 * blink * eh, 0.12)), EYE, BLACK, 0.9);
      if (suit)   // a heavy upper lid: the mask's edge over the eye, for the narrowed, watchful look
        draw(MESH.sphere, chain(E, T(sx * 0.22, eyeY + 0.085 * eh, 0.425), S(0.185, 0.075, 0.125)), MASK_C, BLACK, 0.15, { rim: [0.12, 0.12, 0.15] });
      draw(MESH.sphere, chain(E, T(px - sx * 0.01, py - 0.02 * eh, 0.51), S(0.095, 0.115 * blink * eh, 0.045)), DARK, scaleV(col, 0.3), 1.0);
      draw(MESH.sphere, chain(E, T(hx + 0.035, eyeY + 0.03 * eh, 0.555), S(0.036 * blink * eh)), EYE, scaleV(EYE, 0.8), 0);
      if (!suit) {
        draw(MESH.sphere, chain(E, T(hx - 0.027, eyeY - 0.055, 0.55), S(0.016 * blink)), EYE, scaleV(EYE, 0.8), 0);
        draw(MESH.sphere, chain(H, T(sx * 0.38, -0.14, 0.37), S(0.09, 0.05, 0.035)), CHEEK, scaleV(CHEEK, 0.35), 0.2);
      }
    }
    draw(MESH.smile, o.sad ? chain(H, T(0, -0.24, 0.52), RX(-Math.PI / 2), S(0.08))
                     : suit ? chain(H, T(0.06, -0.14, 0.53), RZ(0.3), RX(Math.PI / 2), S(0.07, 0.07, 0.05))   // smirk
                           : chain(H, T(0, -0.12, 0.535), RX(Math.PI / 2), S(st === "done" || o.shades > 0.5 ? 0.115 : 0.09)),
         CHEEK, scaleV(CHEEK, 0.25), 0.3);
    if (o.talk > 0.02 && !o.sad)   // speaking: the mouth opens with the loudness of the voice
      draw(MESH.sphere, chain(H, T(suit ? 0.06 : 0, -0.155, 0.515), S(0.07, 0.01 + 0.055 * o.talk, 0.03)), DARK, BLACK, 0.1);
    if (o.shades > 0.01) {  // sunglasses: two glossy lenses, a bridge and temples (scaled in by o.shades)
      const g = o.shades;
      for (const sx of [-1, 1]) {
        draw(MESH.sphere, chain(H, T(sx * 0.22, 0.08, 0.6), S(0.2 * g, 0.15 * g, 0.05)), SHADES, scaleV(SEA, 0.12), 1.0);
        if (g > 0.6) draw(MESH.cyl, segM(xf(H, [sx * 0.41, 0.11, 0.55]), xf(H, [sx * 0.58, 0.13, 0.05]), 0.018), SHADES, BLACK, 0.8);
      }
      if (g > 0.6) draw(MESH.cyl, segM(xf(H, [-0.05, 0.12, 0.64]), xf(H, [0.05, 0.12, 0.64]), 0.02), SHADES, BLACK, 0.8);
    }
    updateAntennae(H);
    for (const sx of [-1, 1]) {
      // thinking: a deliberate twiddle; otherwise only a faint drift, the spring does the rest
      const wig = st === "thinking" ? Math.sin(t * 6 + sx) * 0.16 * reduce : nz(t * 0.8, sx * 3) * 0.04 * reduce;
      const a = life.ant[sx];
      const Aa = chain(H, T(sx * 0.16, 0.45, 0.05), RZ(-sx * (0.4 + wig + o.droop) + a.s), RX(-0.2 + a.f));
      draw(MESH.cyl, chain(Aa, T(0, 0.27, 0), S(0.022, 0.55, 0.022)), LIMB);
      draw(MESH.sphere, chain(Aa, T(0, 0.58, 0), S(0.07)), col, scaleV(col, o.pulse * 0.7), 0.6);
      draw(MESH.sphere, chain(Aa, T(0, 0.58, 0), S(0.2)), BLACK, scaleV(col, o.pulse), 0,
           { mode: 2, alpha: Math.min(0.9, 0.45 * o.pulse) });  // a soft glow at rest, bright only when it matters
    }
    if (o.thinkDots) for (let n = 0; n < 3; n++) {
      const a = t * 2.4 + n * 2.094, P = chain(B, T(Math.cos(a) * 0.42, 2.6 + Math.sin(t * 3 + n) * 0.05, Math.sin(a) * 0.42));
      draw(MESH.sphere, chain(P, S(0.06)), col, scaleV(col, 1.0), 0.5);
      draw(MESH.sphere, chain(P, S(0.16)), BLACK, col, 0, { mode: 2, alpha: 0.7 });
    }

    // legs and four arms, all by IK toward their targets
    for (const sx of [-1, 1]) {
      const fe = limb(xf(B, HIP(sx)), xf(B, o.feet[sx]), 0.3 * ks, 0.34 * ks, xd(B, [0, 0.2, 1]), 0.05 * ks, LIMB);
      draw(MESH.sphere, chain(at(B, fe), T(0, 0, 0.05), S(0.1, 0.055, 0.15)), suit ? GOLD : LIMB, BLACK, 0.5);   // boots
      const h = o.hands[sx];
      const rk = h.reach || 1;   // a cartoon stretch for a long point (1 = the normal arm)
      out[sx] = limb(xf(B, SHOULDER(sx)), xf(B, h.up), 0.28 * ks * rk, 0.28 * ks * rk, xd(B, [sx * 0.6, -0.5, -0.6]), 0.045 * ks, LIMB);
      draw(MESH.sphere, chain(T(...out[sx]), S((suit ? 0.085 : 0.075) * ks)), suit ? GOLD : LIMB, st === "waiting" && sx === 1 ? scaleV(col, 0.5) : BLACK, 0.5);
      const lo = limb(xf(B, SHOULDER2(sx)), xf(B, h.low), 0.26 * ks, 0.26 * ks, xd(B, [sx * 0.7, -0.4, -0.5]), 0.04 * ks, LIMB);
      draw(MESH.sphere, chain(T(...lo), S((suit ? 0.075 : 0.065) * ks)), suit ? GOLD : LIMB, BLACK, 0.5);   // gloves
    }
    if (hero > 0.02) drawCape(B, o);
    if (o.shield > 0.02) {   // blocked: a red force field in front of the crossed arms, flashing and fading
      const F = chain(B, T(0, 0.7, 1.05));
      draw(MESH.sphere, chain(F, S(0.95, 0.95, 0.2)), BLACK, hex("#ff4d4d"), 0, { mode: 2, alpha: 0.95 * o.shield });
      draw(MESH.sphere, chain(F, S(0.9, 0.9, 0.16)), hex("#ff6b6b"), scaleV(hex("#ff4d4d"), 0.6), 0.9, { alpha: 0.18 * o.shield });
    }

    // held props (scaled in/out with their state)
    if (o.crate > 0.02) {
      const C = chain(B, T(...CRATE_AT), S(o.crate));
      draw(MESH.box, chain(C, S(CRATE_HALF[0] * 2, CRATE_HALF[1] * 2, CRATE_HALF[2] * 2)), CRATE, BLACK, 0.2);
      draw(MESH.box, chain(C, T(0, CRATE_HALF[1] - 0.005, 0), S(CRATE_HALF[0] * 2 + 0.02, 0.03, CRATE_HALF[2] * 2 + 0.02)), scaleV(CRATE, 0.7), BLACK, 0.2);
      draw(MESH.box, chain(C, T(0, 0, CRATE_HALF[2] + 0.002), S(0.12, CRATE_HALF[1] * 2, 0.005)), scaleV(CRATE, 0.75), BLACK, 0.1);  // tape
    }
    if (o.paper > 0.02) {
      const P = chain(B, T(...PAPER_AT), RX(PAPER_TILT), S(o.paper));
      draw(MESH.box, chain(P, S(PAPER_HALF[0] * 2, PAPER_HALF[1] * 2, 0.012)), PAPER, BLACK, 0.1);
      for (let l = 0; l < 5; l++)  // text lines on the side facing the bug (-z), mirrored so they read left to right for it
        draw(MESH.box, chain(P, T(0.03 - (l % 2) * 0.02, 0.2 - l * 0.1, -0.009), S(0.34 - (l % 2) * 0.08, 0.02, 0.004)), hex("#9aa3b5"), BLACK, 0);
    }
    return out;
  }

  // ---- scenes. Work: a city rooftop at night, the hero's base. Chill: a beach island with a sunbed.
  const Y0 = -1.2;
  function shadow(G, x, z, sx = 0.7, sz = 0.5, a = 0.6, y = 0) {
    draw(MESH.cyl, chain(G, T(x, Y0 + y + 0.004, z), S(sx, 0.002, sz)), BLACK, BLACK, 0, { mode: 1, alpha: a });
  }
  const HOME = [0, 0.15];   // where the hero stands: the landing pad
  const ROOF = hex("#3a4258"), LEDGE = hex("#4d5873"), TOWER = hex("#1d2643"), WIN = hex("#ffd27a"), MOON = hex("#f4efd8"),
        BEACON = hex("#ff3b3b");
  // the skyline is fixed: a seeded random, so it is the same every frame and every visit
  const rnd = (() => { let x = 7; return () => (x = (x * 16807) % 2147483647) / 2147483647; })();
  const SKYLINE = Array.from({ length: 15 }, (_, i) => {
    const w = 0.7 + rnd() * 0.6, h = 1.6 + rnd() * 3.0, row = i % 3, wins = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 3; c++) if (rnd() < 0.35 && h - 0.35 - r * 0.42 > 0.3) wins.push([c, r]);
    return { x: -8 + i * 1.15 + rnd() * 0.3, z: -6.5 - row * 1.3, w, h, d: 0.8, wins, shade: 0.75 + row * 0.12 };
  });
  // the work loop: off the roof, out over the street, round and up over the skyline, back past the roof
  const LOOP = { cz: -3.5, rx: 5.2, rz: 5.5 };
  const loopPoint = (a) => [LOOP.rx * Math.sin(a), Y0 + 1.5 + 4.7 * (1 - Math.cos(a)) / 2 + 0.3 * Math.sin(2 * a), LOOP.cz + LOOP.rz * Math.cos(a)];
  const FLY_T = 5.2, WHIRL_T = 2.4, WIND_C = hex("#cfeaff");
  const FRONT_WINDOWS = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) FRONT_WINDOWS.push([-2.24 + c * 0.64, Y0 - 0.55 - r * 0.75, rnd() < 0.45]);
  const STARS = Array.from({ length: 26 }, () => [(rnd() * 2 - 1) * 9, 1.4 + rnd() * 4.5, -13 - rnd() * 3, rnd() * 6]);
  function drawCity(G, t) {
    // night sky: a moon with a halo, twinkling stars
    draw(MESH.sphere, chain(G, T(-3.4, 3.8, -11), S(0.5)), MOON, scaleV(MOON, 1.1), 0);
    draw(MESH.sphere, chain(G, T(-3.4, 3.8, -11), S(1.4)), BLACK, MOON, 0, { mode: 2, alpha: 0.5 });
    for (const [x, y, z, ph] of STARS) draw(MESH.sphere, chain(G, T(x, y, z), S(0.025 + 0.012 * Math.sin(t * 2 + ph))), MOON, scaleV(MOON, 1.2), 0);
    // skyline: dark towers with a few lit windows
    for (const b of SKYLINE) {
      draw(MESH.box, chain(G, T(b.x, Y0 - 3 + (b.h + 3) / 2, b.z), S(b.w, b.h + 3, b.d)), scaleV(TOWER, b.shade), BLACK, 0.1);
      for (const [c, r] of b.wins)
        draw(MESH.box, chain(G, T(b.x + (c - 1) * b.w * 0.28, Y0 + b.h - 0.35 - r * 0.42, b.z + b.d / 2 + 0.01), S(0.12, 0.16, 0.01)), WIN, scaleV(WIN, 0.9), 0);
    }
    // the roof: flat top, low parapet, a stair hut, a vent, an antenna with a blinking light, the landing pad
    draw(MESH.box, chain(G, T(0, Y0 - 1.6, -0.1), S(5.6, 3.2, 2.8)), ROOF, BLACK, 0.15);
    draw(MESH.box, chain(G, T(0, Y0 - 1.6, 1.305), S(5.6, 3.2, 0.01)), scaleV(ROOF, 0.6), BLACK, 0.1);   // front wall
    for (const [x, y, lit] of FRONT_WINDOWS)
      draw(MESH.box, chain(G, T(x, y, 1.315), S(0.3, 0.4, 0.01)), lit ? WIN : scaleV(TOWER, 0.8), lit ? scaleV(WIN, 0.8) : BLACK, 0.3);
    draw(MESH.box, chain(G, T(0, Y0 + 0.08, 1.24), S(5.6, 0.16, 0.12)), LEDGE, BLACK, 0.2);
    for (const sx of [-1, 1]) draw(MESH.box, chain(G, T(sx * 2.74, Y0 + 0.08, -0.1), S(0.12, 0.16, 2.8)), LEDGE, BLACK, 0.2);
    draw(MESH.box, chain(G, T(-2.0, Y0 + 0.5, -1.0), S(0.9, 1.0, 0.7)), LEDGE, BLACK, 0.2);
    draw(MESH.box, chain(G, T(-2.0, Y0 + 0.4, -0.64), S(0.36, 0.7, 0.02)), scaleV(ROOF, 0.6), BLACK, 0.1);
    draw(MESH.cyl, chain(G, T(-0.9, Y0 + 0.18, -1.05), S(0.16, 0.36, 0.16)), LEDGE, BLACK, 0.4);
    draw(MESH.cyl, segM(xf(G, [2.1, Y0, -0.95]), xf(G, [2.1, Y0 + 2.3, -0.95]), 0.035), LEDGE, BLACK, 0.5);
    const on = (t % 1.6) < 0.18;
    draw(MESH.sphere, chain(G, T(2.1, Y0 + 2.35, -0.95), S(0.07)), BEACON, scaleV(BEACON, on ? 1.5 : 0.2), 0.5);
    if (on) draw(MESH.sphere, chain(G, T(2.1, Y0 + 2.35, -0.95), S(0.3)), BLACK, BEACON, 0, { mode: 2, alpha: 0.8 });
    draw(MESH.ring, chain(G, T(HOME[0], Y0 + 0.004, HOME[1]), S(0.6, 0.12, 0.6)), GOLD, scaleV(GOLD, 0.12), 0.2);
  }
  // DECISION: the bed is sized to the bug (it used to be about the bug's size, so it sat on top of it)
  // DECISION: the bug and the bed shrink together (BEACH_K), so the bed fits on the island with sand all round
  //   and the lying pose (designed at bed scale 2) stays exactly as it was.
  const BEACH_EYE = [0.5, 3.3, 12.8], BEACH_AT = [-0.1, -0.05, 0];   // the beach camera: wide, the whole island
  const BEACH_K = 0.7, BUG_K = 0.6;   // bed scale (vs the original 2.0 bed), the bug's size at the beach
  const BED = { pos: [0.65, Y0, 0.25], yaw: -0.5, back: -0.8, pivot: [0, 0.37, -0.6], scale: 2.0 * BEACH_K };
  // DECISION: a natural palm, about 1.5x the old one: the frond shape (rise, arch, droop), leaflet lengths and the
  //   coconut cluster follow a real coconut palm, so it no longer reads as a green umbrella.
  const PALM_BASE = [-2.15, 0, -0.8];   // island-local, y from the ground (Y0)
  function palmGeom(t) {
    const g = { trunk: [], fronds: [], coconuts: [], fallen: [] };
    let p = [PALM_BASE[0], Y0 + PALM_BASE[1], PALM_BASE[2]];
    g.trunk.push([p, 0.13]);
    for (let i = 0; i < 12; i++) {   // slender, leaning out toward the sunbed, then curving up to the crown
      const q = add(p, [0.17 - i * 0.016, 0.21 + i * 0.006, 0.02]);
      g.trunk.push([q, 0.115 - i * 0.004]);
      p = q;
    }
    const top = p, sway = (f, sp = 1) => Math.sin(t * 0.6 * sp + f * 1.3);
    g.top = top;
    // seen almost from the side (the camera is about 1.44 rad from the palm): a gap in front keeps the coconuts visible
    const CAM_A = 1.44, GAP = 0.6;
    for (let f = 0; f < 11; f++) {   // the lower tier: long fronds arching out and down
      const a = CAM_A + GAP + f / 10 * (Math.PI * 2 - 2 * GAP) + 0.07 * Math.sin(f * 3.7) + 0.04 * sway(f);
      g.fronds.push({ a, shape: f % 2, L: 1.85 + 0.2 * Math.sin(f * 2.3), tilt: 0.05 * sway(f + 7, 1.3), tint: 1 + 0.06 * Math.sin(f * 1.7) });
    }
    for (let f = 0; f < 7; f++) {    // the young tier: shorter fronds reaching up from the middle
      const a = f / 7 * Math.PI * 2 + 0.4 + 0.04 * sway(f + 20);
      g.fronds.push({ a, shape: 2, L: 1.3 + 0.12 * Math.sin(f * 1.9), tilt: 0.08 * sway(f + 30, 1.6), tint: 1.06 });
    }
    g.fronds.push({ a: CAM_A + 2.4, shape: 3, L: 1.3, tilt: 0.03 * sway(40), tint: 1, old: true });   // an old one hanging
    for (const fr of g.fronds) {   // the spine of each frond (the same arch as its mesh), for the stalk and the checks
      const [rise, droop] = FROND_SHAPES[fr.shape], dir = [Math.cos(fr.a), 0, Math.sin(fr.a)];
      fr.spine = [];
      for (let j = 0; j <= 10; j++) {
        const u = j / 10;
        fr.spine.push(add(top, add(sc(dir, u * fr.L * (1 - 0.15 * u)), [0, fr.L * (rise * u - droop * u * u + fr.tilt * u), 0])));
      }
    }
    // coconuts: a cluster just under the crown, in the gap facing the camera
    for (const [ang, dy, r] of [[1.2, -0.1, 0.22], [1.45, -0.13, 0.24], [1.7, -0.1, 0.22], [0.98, -0.14, 0.2],
                                [1.32, -0.27, 0.2], [1.6, -0.27, 0.2]])
      g.coconuts.push([add(top, [Math.cos(ang) * r, dy, Math.sin(ang) * r]), 0.14]);
    g.fallen.push([[PALM_BASE[0] + 0.55, Y0 + 0.07, PALM_BASE[2] + 0.55], 0.11], [[PALM_BASE[0] + 0.78, Y0 + 0.07, PALM_BASE[2] + 0.3], 0.1]);
    return g;
  }
  function drawPalm(G, t) {
    const g = palmGeom(t), k = len(xd(G, [1, 0, 0]));
    const W = (q) => xf(G, q);
    draw(MESH.sphere, chain(G, T(...g.trunk[0][0]), S(0.26, 0.14, 0.26)), TRUNK_D, BLACK, 0.15);   // bulbous base
    draw(MESH.sphere, chain(G, T(...add(g.trunk[0][0], [0.05, 0.12, 0])), S(0.19, 0.16, 0.19)), TRUNK, BLACK, 0.15);
    for (let i = 1; i < g.trunk.length; i++) {
      const [a, ra] = g.trunk[i - 1], [b, rb] = g.trunk[i];
      draw(MESH.cyl, segM(W(a), W(b), (ra + rb) / 2 * k), TRUNK, BLACK, 0.2);
      draw(MESH.sphere, chain(T(...W(b)), S(rb * k * 1.02)), TRUNK, BLACK, 0.2);   // smooth joints
      if (i % 2 === 0) {   // soft rings where old leaves fell
        const d = sc(sub(b, a), 0.025 / len(sub(b, a)));
        draw(MESH.cyl, segM(W(sub(b, d)), W(add(b, d)), rb * 1.06 * k), TRUNK_D, BLACK, 0.2);
      }
    }
    draw(MESH.sphere, chain(G, T(...add(g.top, [0, 0.03, 0])), S(0.13, 0.12, 0.13)), PALM_D, BLACK, 0.3);   // the crown
    for (const fr of g.fronds) {
      for (let j = 1; j < 4; j++)   // the bare stalk (the leaflets start at a quarter of the frond)
        draw(MESH.cyl, segM(W(fr.spine[j - 1]), W(fr.spine[j]), 0.02 * (1 - j / 12) * k), fr.old ? FROND_OLD : PALM_D, BLACK, 0.3);
      // frond-local x along dir = (cos a, 0, sin a): a turn of -a about y; the wind tilts it a little
      draw(MESH.fronds[fr.shape], chain(G, T(...g.top), RY(-fr.a), RZ(fr.tilt), S(fr.L)),
           [fr.tint, fr.tint, fr.tint], BLACK, 0.3);
    }
    for (const [c, r] of g.coconuts.concat(g.fallen)) {
      const i = Math.round(c[0] * 37 + c[2] * 11);
      draw(MESH.sphere, chain(G, T(...c), S(r, r * 0.92, r)), i % 3 ? COCO : COCO_G, BLACK, 0.35);
    }
    // beach grass around the base
    for (let n = 0; n < 9; n++) {
      const a = n * 2.4, b0 = [PALM_BASE[0] + Math.cos(a) * 0.38, Y0, PALM_BASE[2] + Math.sin(a) * 0.38 + 0.12];
      const tip = add(b0, [Math.cos(a) * 0.12 + Math.sin(t * 1.2 + n) * 0.02, 0.22 + (n % 3) * 0.05, Math.sin(a) * 0.06]);

    const wideAt = lerpV([0, Y0 + 2.4, LOOP.cz], cur.p || roofAt, 0.6);
    CAM = lerpV(lerpV(roofEye, wideEye, wd), BEACH_EYE, cur.chill);
    CAM_AT = lerpV(lerpV(roofAt, wideAt, wd), BEACH_AT, cur.chill);
    resize();
    gl.uniformMatrix4fv(U.uVP, false, VP); gl.uniform3fv(U.uCam, CAM);
    const pulse = st === "waiting" ? (Math.sin(t * 10) > 0 ? 1.6 : 0.3) : st === "thinking" ? 0.9 + 0.6 * Math.sin(t * 5) : 1.0;
    const sad = st === "denied" || st === "stuck";
    // the voice's loudness (set by the chat script while an answer is spoken), also while lying on the sunbed
    cur.talk = lerp(cur.talk, Math.min(1, window.__talk || 0), 1 - Math.exp(-dt * 30));

    if (workS > 0) {
      const G = chain(T(0, Y0, 0), S(ease(workS)), T(0, -Y0, 0));
      drawCity(G, t);
      // the hero moves on a critically damped spring toward a target that depends on the state: moving files =
      // the big flight loop with a whirlwind every half lap; otherwise on the pad (thinking stays on the ground).
      // DECISION: a big loop through the city, not laps on the roof. why -> laps read as pacing in circles.
      let tgt = (presenting ? spot : home).slice(), omega = 4;
      if (st === "moving") {
        hero.clock += dt * reduce;
        const cyc = hero.clock % (FLY_T + WHIRL_T);
        hero.wp = cyc > FLY_T ? (cyc - FLY_T) / WHIRL_T : -1;   // whirlwind progress 0..1, or -1 while flying
        hero.env = hero.wp < 0 ? 0 : smooth(0, 0.15, hero.wp) * (1 - smooth(0.85, 1, hero.wp));
        hero.ph += dt * reduce * 0.55 * (1 - Math.min(1, hero.env * 1.5));   // it stops on the spot to spin
        tgt = loopPoint(hero.ph);
        omega = 3.2;
      } else { hero.wp = -1; hero.env = lerp(hero.env, 0, k * 3); }
      if (st === "done") tgt[1] += 0.25 * smooth(0, 0.8, age);
      else if (st === "stuck") tgt[1] -= 0.3 * HS;
      else if (st === "denied") tgt[2] -= 0.15 * Math.exp(-age * 2.5);   // knocked back a little by the block
      if (!cur.p || beachS > 0.99) { cur.p = tgt.slice(); cur.v = [0, 0, 0]; }   // (re)appearing after the beach
      if (st !== "moving") {   // going somewhere on the roof (to the panel side and back): a little hop, not a slide
        const far = Math.hypot(cur.p[0] - tgt[0], cur.p[2] - tgt[2]);
        tgt[1] += Math.min(0.4, far * 0.5);
      }
      const prevV = cur.v;
      cur.v = add(cur.v, sc(sub(sc(sub(tgt, cur.p), omega * omega), sc(cur.v, 2 * omega)), dt));
      cur.p = add(cur.p, sc(cur.v, dt));
      const acc = dt > 0 ? sc(sub(cur.v, prevV), 1 / dt) : [0, 0, 0];
      const hs = Math.hypot(cur.v[0], cur.v[2]), whirl = hero.env;
      if (whirl > 0.02) cur.yaw = wrapA(cur.yaw + dt * 17 * whirl * reduce);   // the whirlwind: a fast spin on the spot
      // whenever it travels (also flying back to the pad) it faces where it goes, so the cape trails behind
      else cur.yaw = angLerp(cur.yaw, hs > 0.4 ? Math.atan2(cur.v[0], cur.v[2]) : -0.3, 1 - Math.exp(-dt * (hs > 0.4 ? 8 : 5)));
      // pointing at the chat panel: the side of the screen it is on, in the hero's own frame (camera right, turned by -yaw)
      let pdir = null, pside = 1;
      if (ui.point && st === "waiting") {
        const R = norm(cross(norm(sub(CAM_AT, CAM)), [0, 1, 0])), c = Math.cos(cur.yaw), s = Math.sin(cur.yaw);
        pdir = norm([c * R[0] - s * R[2], 0, s * R[0] + c * R[2]]);
        pside = pdir[0] >= 0 ? 1 : -1;
      }
      const right = [Math.cos(cur.yaw), 0, -Math.sin(cur.yaw)];   // lean into the flight, bank into turns; toward the panel
      cur.pitch = lerp(cur.pitch, st === "stuck" ? 0.25 : Math.min(0.45, hs * 0.18) * (1 - whirl), 1 - Math.exp(-dt * 4));
      cur.roll = lerp(cur.roll, clampN(-dot(acc, right) * 0.12, 0.6) * (1 - whirl) - (pdir ? 0.13 * pside : 0), 1 - Math.exp(-dt * 4));
      const height = (cur.p[1] - home[1]) / HS, air = smooth(0.06, 0.35, height);
      const hover = Math.sin(t * 1.8) * 0.03 * HS * air * reduce;
      cur.look = lerp(cur.look || 0, pdir ? Math.max(-0.6, Math.min(0.6, Math.atan2(pdir[0], pdir[2]) * 0.45)) : 0, k * 2);
      let headYaw = gaze[0] * 0.18 + nz(t * 0.6, 2) * 0.05 * reduce + cur.look, headTilt = nz(t * 0.6, 1) * 0.04 * reduce;
      const extraPitch = -gaze[1] * 0.08 + nz(t * 0.5, 7) * 0.03 * reduce - cur.pitch * 0.6;   // in flight: look ahead
      if (st === "thinking") headTilt += Math.sin(t * 1.6) * 0.1 * reduce;
      if (st === "denied") headYaw += Math.sin(age * 20) * 0.3 * Math.exp(-age * 2.2) * reduce;
      for (const sx of [-1, 1]) {
        let tg = whirl > 0.3 ? { up: [sx * 0.85, 0.75, 0.05], low: [sx * 0.8, -0.05, 0.05] } : handTargets(st, t, sx);   // arms out to spin
        if (pdir && sx === pside)   // the arm on the panel's side points at it, tapping the air a little
          // (the arm stretches to ~1.7x for this, so it reaches well past the shell, a little up and forward)
          tg = { up: [pdir[0] * 1.22, 0.74 + Math.sin(t * 6) * 0.04 * reduce, pdir[2] * 1.22 + 0.62], low: tg.low };
        cur.reach[sx] = lerp(cur.reach[sx], pdir && sx === pside ? 1.7 : 1, k * 1.8);
        cur.hands[sx] = { up: lerpV(cur.hands[sx].up, tg.up, k * 1.8), low: lerpV(cur.hands[sx].low, tg.low, k * 1.8),
                          reach: cur.reach[sx] };
      }
      cur.crate = lerp(cur.crate, st === "moving" && whirl < 0.3 ? 1 : 0, k * 2);
      cur.paper = lerp(cur.paper, st === "reading" ? 1 : 0, k * 2);
      cur.shield = st === "denied" ? Math.min(1, age * 6) * (0.8 + 0.2 * Math.sin(age * 18)) * Math.max(0.35, Math.exp(-age * 0.8))
                                   : lerp(cur.shield, 0, k * 3);
      // feet: planted on the roof (one knee down when stuck), trailing back in flight (body units)
      const feet = {};
      for (const sx of [-1, 1]) {
        const groundY = (Y0 - cur.p[1]) / HS + 0.055;
        const planted = st === "stuck" ? [sx * 0.2, groundY, sx > 0 ? 0.34 : -0.2] : [sx * 0.2, groundY, 0.08];
        const trailing = [sx * 0.15, -1.02 + Math.sin(t * 3 + sx) * 0.03 * reduce, -0.1 - 0.08 * sx * Math.sin(t * 2) * reduce];
        feet[sx] = lerpV(planted, trailing, air);
      }
      if (hero.wp >= 0) {   // the whirlwind: a spinning funnel, and loose papers swept up in a spiral and gone
        const c = cur.p, q = hero.wp;
        for (let i = 0; i < 6; i++) {
          const f = i / 5, R = (0.4 + f * 1.1) * (0.4 + 0.6 * whirl);
          draw(MESH.ring, chain(G, T(c[0], c[1] - 0.95 + f * 1.9, c[2]), RY(t * 9 + i), S(R, 0.35, R)), BLACK, WIND_C, 0,
               { mode: 2, alpha: 0.4 * whirl });
        }
        for (let i = 0; i < 14; i++) {
          const pi = Math.min(1, Math.max(0, q * 1.5 - i * 0.035)), a = i * 2.4 + pi * 10;
          const r = (1 - pi) * 2.0 + 0.15, sz = (1 - smooth(0.8, 1, pi)) * smooth(0, 0.08, q) * 1.5;
          if (sz > 0.01) draw(MESH.box, chain(G, T(c[0] + Math.cos(a) * r, c[1] - 1.1 * (1 - pi), c[2] + Math.sin(a) * r), RY(a * 1.3), RX(a),
                                                S(0.2 * sz, 0.006, 0.15 * sz)), PAPER, scaleV(PAPER, 0.15), 0.2);
        }
      }
      if (!cur.fly) {
        const overRoof = Math.abs(cur.p[0]) < 2.75 && cur.p[2] > -1.5 && cur.p[2] < 1.3;
        if (overRoof) shadow(G, cur.p[0], cur.p[2], Math.max(0.1, (0.62 - height * 0.25) * HS), Math.max(0.08, (0.45 - height * 0.18) * HS),
                             Math.max(0.1, 0.55 - height * 0.3));
        const B = chain(G, T(cur.p[0], cur.p[1] + hover + breath * 0.008 * HS * reduce * (1 - air), cur.p[2]),
                        RY(cur.yaw), RX(cur.pitch), RZ(cur.roll), S(HS));
        drawBug(B, { col, st, t, open: shellOpen, headYaw, headTilt, headPitch: headPitch + extraPitch, hands: cur.hands, feet,
                     crate: cur.crate, paper: cur.paper, shades: 0, sad, pulse, talk: cur.talk, droop: sad ? 0.7 : 0, thinkDots: st === "thinking",
                     blink, gaze, breath, hero: 1, shield: cur.shield, spd: len(cur.v) / HS });
      }
    }

    // sips every 7 s, counted from settling on the bed (the first ~4 s after landing), so landing never cuts into one
    const sipT = (t - cur.restT + 3) % 7, sip = sipT < 1.8 ? Math.sin(Math.PI * sipT / 1.8) : 0;
    if (beachS > 0) {
      const bs = ease(beachS), G = chain(T(0, Y0, 0), S(bs), T(0, -Y0, 0));
      drawBeach(G, t, bs);
      if (!cur.fly) {  // lying back on the sunbed, head tipped toward the viewer; sips every few seconds
        const B = lieFrame(G, t);
        dbg.bug = B;
        const headYaw = Math.sin(t * 0.4) * 0.12 * reduce * (1 - sip), headTilt = 0.08 * (1 - sip), headPitch = LIE.pitch + 0.1 * sip;
        // where the lips will be this frame, then the glass placed so its straw ends there
        const Hb = chain(T(0, 1.22 + LIE.neck, 0.08 + LIE.neck * 0.6), RY(headYaw), RZ(headTilt), RX(headPitch));
        const mouthW = xf(B, xf(Hb, MOUTH));
        const glassW = sub(mouthW, sc(STRAW_TIP, bs * BUG_K));
        const hands = lieHands();
        hands[-1] = { ...hands[-1], up: lerpV(hands[-1].up, toBody(B, sub(glassW, xd(B, GLASS_OFF))), sip) };
        const out = drawBug(B, { col, st: "idle", t, open: 0, neck: LIE.neck, headYaw, headTilt, headPitch,
                                 hands, feet: lieFeet(), crate: 0, paper: 0, shades: 1, sad: false, talk: cur.talk,
                                 pulse: 1, droop: 0.15, thinkDots: false, blink, gaze, breath: breath * 0.6 });
        drawCocktail(out[-1], B, bs * BUG_K, out.mouth, sip);
      }
    }

    if (cur.fly) {
      // in seconds: rise off the roof (0-1.15), hover while the scenes swap (1.15-2.1), glide in and touch down
      // standing on the seat (2.1-3.4), take the weight (3.4-3.8), then sit back onto the backrest (3.8-5.1).
      // The last frame is exactly the resting pose (same frame, feet, hands, head), so nothing jumps after it.
      const { p0, yaw0 } = cur.fly, pH = [0, 0.95, 0.7], s = fs;
      const L = lieFrame(I(), t), pL = xf(L, [0, 0, 0]), lf = lieFeet(), lh = lieHands();
      const footW = { [-1]: xf(L, lf[-1]), 1: xf(L, lf[1]) };   // where the feet rest on the seat (world)
      const STAND = HIP_H - 0.055;   // body origin above the soles when standing (body units)
      const pS = add(sc(add(footW[-1], footW[1]), 0.5), [0, STAND * BUG_K, 0]);   // standing on the seat
      const size = lerp(HS, BUG_K, smooth(1.14, 2.09, s));   // the city size to the beach size
      let pos, yaw, tilt = 0, glide = 0, touch = 0, back = 0;
      if (s < 1.15) {
        const e = smooth(0, 1, s / 1.15);
        pos = lerpV(p0, pH, e); pos[1] += Math.sin(Math.PI * e) * 0.35; yaw = angLerp(yaw0, -0.35, e);
      } else if (s < 2.1) {
        const h = (s - 1.15) / 0.95;
        pos = [pH[0] + Math.sin(h * Math.PI * 2) * 0.12, pH[1] + Math.sin(h * Math.PI * 4) * 0.06, pH[2]];
        yaw = -0.35 + Math.sin(h * Math.PI * 2) * 0.15;
      } else {
        glide = smooth(2.1, 3.4, s);
        // a curve that comes in above the seat and lowers onto it slowing down (no sideways slide at the end)
        const b0 = pH, b1 = add(pH, [0, 0.2, 0]), b2 = add(pS, [0, 0.5, 0]), b3 = pS, u = glide, v = 1 - u;
        pos = [0, 1, 2].map((i) => v * v * v * b0[i] + 3 * v * v * u * b1[i] + 3 * v * u * u * b2[i] + u * u * u * b3[i]);
        yaw = angLerp(-0.35, BED.yaw, smooth(2.1, 3.1, s));
        touch = s < 3.4 ? 0 : Math.sin(Math.PI * Math.min(1, (s - 3.4) / 0.4));   // knees give a little, then up
        pos[1] -= touch * 0.06 * BUG_K;
        if (s > 3.8) {   // sit back: the hips go back and down while the body leans onto the backrest
          back = smooth(3.8, 5.1, s);
          pos = lerpV(pS, pL, smooth(0, 0.9, back));
          pos[1] -= Math.sin(Math.PI * back) * 0.04 * BUG_K;   // a soft sink into the cushion on the way
          tilt = BED.back * smooth(0.08, 1, back);
        }
      }
      const B = chain(T(...pos), RY(yaw), RX(tilt), S(size));
      dbg.bug = B;   // for the landing checks
      const dangle = (sx) => ({ up: [sx * 0.55, 0.15 + Math.sin(t * 9 + sx) * 0.05, 0.3], low: [sx * 0.5, -0.3, 0.3] });
      const balance = (sx) => ({ up: [sx * 0.7, 0.32, 0.25], low: [sx * 0.62, -0.08, 0.25] });   // arms out on touchdown
      const reach = smooth(0.45, 0.95, glide), hands = {}, feet = {};
      for (const sx of [-1, 1]) {
        const d = dangle(sx), bl = balance(sx), arm = (part) => lerpV(lerpV(d[part], bl[part], reach), lh[sx][part], back);
        hands[sx] = { up: arm("up"), low: arm("low") };
        const trail = [sx * 0.18, -1.0 + Math.sin(t * 8 + sx * 2) * 0.06, 0.25];
        // legs reach down before touchdown; from then on the feet stay where they landed while the body moves
        feet[sx] = s < 3.4 ? lerpV(trail, [sx * 0.2, -STAND, 0.08], reach) : toBody(B, footW[sx]);
      }
      const height = Math.max(0, pos[1] - (Y0 + HIP_H));
      if (s < 3.4) shadow(I(), pos[0], pos[2], Math.max(0.15, 0.6 - height * 0.25), Math.max(0.1, 0.45 - height * 0.2),
                          Math.max(0.1, 0.5 - height * 0.3) * (1 - glide));
      const settle = Math.sin(t * 0.4) * 0.12 * reduce * back;   // the resting pose's slow head turn, faded in
      const out = drawBug(B, { col, st: "idle", t, open: 0, headYaw: settle, headTilt: 0.08 * back,
                               headPitch: lerp(lerp(-0.1, 0.12, reach), LIE.pitch, back), neck: LIE.neck * back, hands, feet,
                               crate: 0, paper: 0, shades: smooth(0.55, 1, back), sad: false, talk: cur.talk, pulse: 1, droop: 0.15 * back,
                               thinkDots: false, blink, gaze: lerpV([0, 0.2], gaze, back), breath: breath * 0.6 * back,
                               hero: 1 - smooth(1.33, 2.66, s) });
      const glass = smooth(0.75, 1, back);
      if (glass > 0.01) drawCocktail(out[-1], B, glass * BUG_K, out.mouth, 0);
      if (s >= FLY_S) { cur.fly = null; cur.chill = 1; cur.restT = t; }
    }

    flushLater();
  }
  requestAnimationFrame(frame);
}
</script>
</body>
