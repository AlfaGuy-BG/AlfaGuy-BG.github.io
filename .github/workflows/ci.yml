name: CI

# Every push, every pull request, and every night: scan, test, and only then publish.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 1 * * *"   # 03:17 Sofia time in winter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Pre-publish scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks reads the whole history
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Scanner unit tests
        run: node --test tests/scan.test.mjs
      - name: Scan the site for secrets, ticket keys, internal hosts and private terms
        run: node tools/prepublish_scan.mjs site
        env:
          PREPUBLISH_DENYLIST: ${{ secrets.PREPUBLISH_DENYLIST }}
      - name: Secrets in git history (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Playwright (desktop + mobile)
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site            # only the site is published, never tests or tools
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the live site is ours, not a Jekyll build
        run: |
          sleep 20
          html=$(curl -fsSL "https://alfaguy-bg.github.io/?v=${GITHUB_SHA}")
          echo "$html" | grep -q 'class="runbar"' || { echo "Live site is not site/index.html"; exit 1; }
          if echo "$html" | grep -q 'name="generator" content="Jekyll'; then echo "Jekyll is serving the README"; exit 1; fi
          curl -fsI "https://alfaguy-bg.github.io/og.png" | grep -qi 'content-type: image/png'
